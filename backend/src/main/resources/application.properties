# ============================================================
# Library Management System - Application Properties
# ============================================================

# Application Name
spring.application.name=Library Management System

# ============================================================
# MySQL Database Configuration
# Uses environment variables so we never hardcode credentials
# ============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/library_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:vsrv.com}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / Hibernate Configuration
# ============================================================

# ddl-auto=update: Hibernate will create/update tables automatically
# For production, change this to 'validate'
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console (helpful during development)
spring.jpa.show-sql=true

# Format SQL for readability
spring.jpa.properties.hibernate.format_sql=true

# MySQL dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================================
# Server Configuration
# ============================================================
server.port=8080
