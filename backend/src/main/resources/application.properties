spring.application.name=Library Management System

# ===========================
# MySQL Database
# ===========================
spring.datasource.url=jdbc:mysql://localhost:3306/library_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=password

# ===========================
# JPA / Hibernate
# ===========================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# 'update' keeps your data between restarts instead of dropping tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# ===========================
# SQL Initialization
# ===========================
spring.sql.init.mode=never

# ===========================
# Server
# ===========================
server.port=8080

# ===========================
# CORS (frontend served from same origin, so CORS less critical)
# ===========================
cors.allowed-origins=http://localhost:5173,http://localhost:8080,https://library-management-system-x6m2-iota.vercel.app,https://library-management-system-ta54.vercel.app
