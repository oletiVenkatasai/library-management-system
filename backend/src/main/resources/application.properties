spring.application.name=Library Management System

# ===========================
# H2 In-Memory Database
# ===========================
spring.datasource.url=jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===========================
# JPA / Hibernate
# ===========================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# ===========================
# H2 Console (optional: http://localhost:8080/h2-console)
# ===========================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===========================
# SQL Initialization
# ===========================
spring.sql.init.mode=always

# ===========================
# Server
# ===========================
server.port=8080

# ===========================
# CORS (frontend served from same origin, so CORS less critical)
# ===========================
cors.allowed-origins=http://localhost:5173,http://localhost:8080
